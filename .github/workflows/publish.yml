# Build the image and push it to GHCR.
#
# This workflow is what makes the paste-YAML install work at all: TrueNAS's
# Install-via-YAML screen pulls an image, it does not build one, so something has to
# produce the tag that docker-compose.yml references.
#
# One-time setup after the first successful run: make the GHCR package public
# (Packages > mkworld-lounge-tracks > Package settings > Change visibility). The
# image carries no secrets, and a private package would need registry credentials on
# the NAS, which the paste-YAML flow has nowhere clean to put.
name: publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The NAS is amd64; arm64 is here only so the image is usable elsewhere.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
