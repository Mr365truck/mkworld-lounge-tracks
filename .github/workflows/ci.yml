name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest -q

      # The committed CSS must match its source, or a template change ships with
      # classes that were never compiled.
      - name: Check app.css is up to date
        run: |
          curl -sSL -o tailwindcss \
            https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x tailwindcss
          cp app/static/app.css /tmp/app.css.committed
          ./tailwindcss -i app/static/src/input.css -o app/static/app.css --minify
          diff -q /tmp/app.css.committed app/static/app.css \
            || { echo "::error::app/static/app.css is stale — run tools/build_css.sh and commit"; exit 1; }
